name: Build game (index.html)

# GitHub Pages serves this repo straight from the main branch.
# On every push this rebuilds the playable index.html from the source in src/
# and commits it, so the live game is always up to date.
on:
  push:
    branches: [main]
    paths-ignore: [index.html]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit rebuilt game
        run: |
          if git diff --quiet -- index.html; then echo "index.html already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild index.html"
          git push
