<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#2f86d6"/></linearGradient>
    <linearGradient id="blk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc14d"/><stop offset="1" stop-color="#f08c12"/></linearGradient>
    <radialGradient id="body" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#7fd060"/><stop offset="1" stop-color="#3f9636"/></radialGradient>
    <radialGradient id="hat" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#f2b705"/></radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="410" cy="104" r="34" fill="#fff6c9" opacity=".9"/>
  <ellipse cx="256" cy="540" rx="380" ry="150" fill="#57a83a"/>
  <ellipse cx="256" cy="548" rx="380" ry="140" fill="#4b9832"/>
  <!-- blocks -->
  <g stroke="#b86a08" stroke-width="6" stroke-linejoin="round">
    <rect x="140" y="336" width="112" height="84" rx="10" fill="url(#blk)"/>
    <rect x="260" y="336" width="112" height="84" rx="10" fill="url(#blk)"/>
    <rect x="200" y="252" width="112" height="84" rx="10" fill="url(#blk)"/>
  </g>
  <g fill="#fff" opacity=".35"><rect x="152" y="346" width="60" height="10" rx="5"/><rect x="272" y="346" width="60" height="10" rx="5"/><rect x="212" y="262" width="60" height="10" rx="5"/></g>
  <!-- feet -->
  <g stroke="#e9963a" stroke-width="9" stroke-linecap="round"><path d="M236 236v18M276 236v18"/></g>
  <!-- tail -->
  <path d="M188 196 L140 222 L150 194 Z" fill="#3f7fc8" stroke="#2c5f99" stroke-width="5" stroke-linejoin="round"/>
  <!-- body -->
  <circle cx="256" cy="180" r="78" fill="url(#body)" stroke="#2f7a2a" stroke-width="6"/>
  <ellipse cx="262" cy="214" rx="46" ry="36" fill="#9be07a" opacity=".85"/>
  <!-- face -->
  <circle cx="290" cy="160" r="40" fill="#f2603a"/>
  <path d="M319 156 L352 170 L318 184 Z" fill="#fff0cf" stroke="#c9a46a" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="296" cy="148" r="11" fill="#1a1a1a"/><circle cx="299" cy="144" r="4" fill="#fff"/>
  <!-- wing -->
  <ellipse cx="232" cy="194" rx="34" ry="44" fill="#47a03c" stroke="#2f7a2a" stroke-width="5" transform="rotate(18 232 194)"/>
  <!-- hard hat -->
  <path d="M196 116 a60 50 0 0 1 120 0 z" fill="url(#hat)" stroke="#c48f00" stroke-width="6" stroke-linejoin="round"/>
  <rect x="184" y="110" width="146" height="16" rx="8" fill="#f2b705" stroke="#c48f00" stroke-width="5"/>
  <rect x="249" y="70" width="14" height="40" rx="6" fill="#ffd23f"/>
</svg>
